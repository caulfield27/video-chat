<div class="relative flex h-[100dvh] flex-col overflow-hidden md:gap-4 md:px-6 md:py-4">
  <div class="hidden shrink-0 md:block">
    <call-header />
  </div>

  <div
    class="call-chrome pointer-events-none absolute inset-x-0 top-0 z-30 px-2 pt-2 md:hidden"
    [ngClass]="
      mobileChromeVisible()
        ? 'translate-y-0 opacity-100'
        : '-translate-y-4 opacity-0'
    "
  >
    <div data-no-stage-toggle class="pointer-events-auto">
      <call-header />
    </div>
  </div>

  <main
    class="grid min-h-0 flex-1 overflow-hidden md:gap-4"
    [ngClass]="app.isChatOpen() ? 'md:grid-cols-[minmax(0,1fr)_320px]' : ''"
  >
    <section
      class="relative min-h-0 overflow-hidden md:rounded-[28px]"
      (click)="handleStageTap($event)"
    >
      <call-gallery />
    </section>

    @if (app.isChatOpen()) {
      <call-chat />
    }
  </main>

  <div class="hidden shrink-0 md:block">
    <call-footer />
  </div>

  <div
    class="call-chrome pointer-events-none absolute inset-x-0 bottom-0 z-30 px-2 pb-2 md:hidden"
    [ngClass]="
      mobileChromeVisible()
        ? 'translate-y-0 opacity-100'
        : 'translate-y-4 opacity-0'
    "
  >
    <div data-no-stage-toggle class="pointer-events-auto">
      <call-footer />
    </div>
  </div>
</div>
