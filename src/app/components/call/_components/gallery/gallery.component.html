<div class="relative flex h-full w-full flex-col">
  <div class="min-h-0 flex-1 overflow-hidden p-2 md:p-4">
    <div
      class="grid h-full w-full gap-2 md:gap-4"
      [style.grid-template-columns]="
        'repeat(' + gridDims().cols + ', minmax(0, 1fr))'
      "
      [style.grid-template-rows]="
        'repeat(' + gridDims().rows + ', minmax(0, 1fr))'
      "
    >
      @for (tile of pageTiles(); track tile.id) {
        <div class="flex min-h-0 min-w-0 items-center justify-center">
          <div
            class="relative h-full w-full overflow-hidden rounded-2xl bg-[var(--primary-bg)] transition-shadow duration-150 md:aspect-video md:h-auto md:w-auto md:max-h-full md:max-w-full"
            [ngClass]="
              isActiveSpeaker(tile)
                ? 'ring-2 ring-[var(--brand)] ring-offset-2 ring-offset-[var(--bg-primary)]'
                : 'ring-1 ring-[var(--stroke)]'
            "
          >
            @if (!tile.stream || tile.isVideoOff) {
              <div
                class="flex h-full w-full items-center justify-center bg-[var(--primary)]"
              >
                <div
                  class="flex h-14 w-14 items-center justify-center rounded-full text-white shadow-2xl sm:h-16 sm:w-16 md:h-20 md:w-20"
                  [style.background]="tile.color"
                >
                  <span class="text-xl font-semibold sm:text-2xl md:text-3xl">{{
                    initials(tile.userName)
                  }}</span>
                </div>
              </div>
            } @else {
              <video
                [appMediaStream]="tile.stream"
                autoplay
                playsinline
                [muted]="tile.isLocal"
                (loadedmetadata)="handleCanPlay($event)"
                class="h-full w-full object-cover"
              ></video>
            }

            <div
              class="pointer-events-none absolute bottom-2 left-2 z-20 flex max-w-[calc(100%-1rem)] items-center gap-1.5 rounded-lg bg-black/45 px-2 py-1 text-white backdrop-blur-sm"
            >
              <lucide-icon
                [img]="tile.isMuted ? MicOffIcon : MicIcon"
                [class]="
                  (tile.isMuted ? 'text-red-400' : 'text-white') +
                  ' h-3.5 w-3.5 shrink-0'
                "
              />
              <span class="truncate text-xs font-medium sm:text-sm">{{
                displayName(tile)
              }}</span>
            </div>
          </div>
        </div>
      }
    </div>
  </div>

  @if (totalPages() > 1) {
    <div
      data-no-stage-toggle
      class="flex shrink-0 items-center justify-center gap-4 pb-2"
    >
      <button
        (click)="prevPage()"
        [disabled]="currentPage() === 0"
        class="flex h-8 w-8 items-center justify-center rounded-full bg-[var(--bg-surface)] text-[var(--text-primary)] transition hover:bg-[var(--hover-surface)] disabled:opacity-40"
      >
        <lucide-icon [img]="ChevronLeftIcon" class="h-4 w-4" />
      </button>

      <span class="text-xs font-medium text-[var(--text-muted)]">
        {{ currentPage() + 1 }} / {{ totalPages() }}
      </span>

      <button
        (click)="nextPage()"
        [disabled]="currentPage() === totalPages() - 1"
        class="flex h-8 w-8 items-center justify-center rounded-full bg-[var(--bg-surface)] text-[var(--text-primary)] transition hover:bg-[var(--hover-surface)] disabled:opacity-40"
      >
        <lucide-icon [img]="ChevronRightIcon" class="h-4 w-4" />
      </button>
    </div>
  }
</div>
